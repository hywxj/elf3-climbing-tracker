[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elf3-climbing-tracker"
version = "0.1.0"
description = "ELF3 reference-guided contact tracker (simulation research)"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3", "scipy==1.15.3", "mujoco==3.11.0", "tensorboard", "GitPython"]

[project.scripts]
elf3-tracker = "elf3_climbing.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elf3_climbing = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.format]
quote-style = "double"
