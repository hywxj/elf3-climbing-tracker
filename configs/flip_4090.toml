# Starting configuration for a 4090. 128 environments have NOT been benchmarked here.
# CLI arguments override [run]. No training starts by reading this file.
[run]
segment = "flip"
reward_stage = "prior"
num_envs = 128
iterations = 2000
seed = 42

[ppo]
num_steps_per_env = 24
save_interval = 100

[ppo.algorithm]
learning_rate = 0.0003
entropy_coef = 0.001
num_learning_epochs = 4
num_mini_batches = 4

[ppo.policy]
init_noise_std = 0.08
