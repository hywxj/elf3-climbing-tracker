# Warm start from the accepted balance checkpoint; remain on the same flat ground.
[run]
segment = "flip"
flat_ground = true
wrist_only = true
no_curriculum = true
reward_stage = "prior"
num_envs = 512
iterations = 200
eval_interval = 20
early_stop_patience = 3
failure_warmup_iterations = 200
wrist_noise_std = 0.005
balance_noise_std = 0.02
seed = 42

[ppo]
num_steps_per_env = 48
save_interval = 20

[ppo.algorithm]
learning_rate = 0.0001
schedule = "adaptive"
clip_param = 0.1
entropy_coef = 0.0
num_learning_epochs = 5
num_mini_batches = 4

[ppo.policy]
init_noise_std = 0.01
